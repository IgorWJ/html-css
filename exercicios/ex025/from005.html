<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de Formulários</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="ifem" checked value="F"><label for="ifem">Feminino</label> <br>
            <input type="radio" name="sexo" id="imasc" value="M"><label for="imasc">Masculino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <p>
                <input type="checkbox" name="basq" id="ibasq"> <label for="ibasq">Basquete</label> <br>
                <input type="checkbox" name="fut" id="ifut"> <label for="ifut">Futebol </label><br>
                <input type="checkbox" name="nata" id="inata"> <label for="inata">Natação</label> <br>
                <input type="checkbox" name="ten" id="iten"> <label for="iten">Tênis</label> <br>
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
